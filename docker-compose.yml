name: desafio-go

services:
  postgres:
    image: postgres:17-alpine
    container_name: desafio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - desafio

  localstack:
    image: localstack/localstack:3.4.0
    container_name: desafio-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - desafio

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: desafio-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 8s
      timeout: 5s
      retries: 30
    networks:
      - desafio

  # Aplicação: compilada do Dockerfile e executada no mesmo overlay de rede da
  # infraestrutura. No start, aplica migrations e provisiona as filas SQS.
  # `make up` equivale a `docker compose up --build` + provision (idempotente).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desafio-app
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      OIDC_ISSUER_URL: http://keycloak:8080/realms/wallet
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-wallet-service}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-wallet-service-secret}
      OIDC_INTERNAL_CLIENT_ID: ${OIDC_INTERNAL_CLIENT_ID:-wallet-service-internal}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_QUEUE: ${AWS_SQS_QUEUE:-wager-transactions.fifo}
      AWS_SQS_DLQ: ${AWS_SQS_DLQ:-wager-transactions-dlq.fifo}
      AWS_SQS_EVENT_QUEUE: ${AWS_SQS_EVENT_QUEUE:-wallet-events.fifo}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      WORKER_REFERENCE_INTERVAL: ${WORKER_REFERENCE_INTERVAL:-2s}
      WORKER_OUTBOX_INTERVAL: ${WORKER_OUTBOX_INTERVAL:-1s}
      WORKER_OUTBOX_BATCH: ${WORKER_OUTBOX_BATCH:-32}
      WORKER_SQS_POLL_INTERVAL: ${WORKER_SQS_POLL_INTERVAL:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-25s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - desafio

volumes:
  pgdata:
  localstack_data:

networks:
  desafio:
    driver: bridge
